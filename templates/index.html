<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GUDLFT Registration</title>
</head>
<body>
  <h1>Welcome to the GUDLFT Registration Portal!</h1>

  {% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
      <ul>
        {% for category, message in messages %}
          <li style="color: {{ 'red' if category in ['error', 'danger'] else 'green' }};" >
            {{ message }}
          </li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <p>Please enter your secretary email to continue:</p>
  <form action="{{ url_for('showSummary') }}" method="post">
    <label for="email">Email:</label>
    <input
      type="email"
      name="email"
      id="email"
      required
      autocomplete="email"
      placeholder="john@simplylift.co"
    />
    <button type="submit">Enter</button>
  </form>
</body>
</html>
