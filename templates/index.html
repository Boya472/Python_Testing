{% extends "base.html" %}
{% block title %}Connexion | GUDLFT{% endblock %}
{% block content %}
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4 mb-3">Welcome to the GUDLFT Registration Portal!</h1>
      <p class="text-muted">Please enter your secretary email to continue:</p>
      <form action="{{ url_for('showSummary') }}" method="post" class="row gy-2 gx-3 align-items-center">
        <div class="col-sm-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" name="email" id="email"
                 required autocomplete="email" placeholder="john@simplylift.co">
        </div>
        <div class="col-auto align-self-end">
          <button type="submit" class="btn btn-primary">Enter</button>
        </div>
      </form>
      <hr class="my-4">
      <a href="{{ url_for('leaderboard') }}" class="link-secondary">Voir le tableau public des points</a>
    </div>
  </div>
{% endblock %}
