<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GUDLFT Registration</title>
</head>
<body>
  {% include "_flash.html" %}

  <h1>Welcome to the GUDLFT Registration Portal!</h1>

  <p>Please enter your secretary email to continue:</p>
  <form action="{{ url_for('showSummary') }}" method="post">
    <label for="email">Email:</label>
    <input
      type="email"
      name="email"
      id="email"
      required
      autocomplete="email"
      placeholder="john@simplylift.co"
    />
    <button type="submit">Enter</button>
  </form>
</body>
</html>
<style>
  #flash-messages { list-style:none; padding:0; margin: 1rem 0; }
  #flash-messages .flash { padding:.5rem .75rem; margin-bottom:.5rem; border-radius:6px; }
  #flash-messages .success { background:#e6ffed; color:#0a662b; }
  #flash-messages .error { background:#ffe6e6; color:#8a0000; }
  #flash-messages .info { background:#eef5ff; color:#0b4a99; }
</style>
