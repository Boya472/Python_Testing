{% extends "base.html" %}
{% block title %}Leaderboard | GUDLFT{% endblock %}
{% block content %}
  <h1 class="h4 mb-3">Tableau public des points</h1>
  <p class="text-muted">Page publique (lecture seule) — aucun compte requis.</p>

  <div class="table-responsive">
    <table class="table table-striped table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th scope="col">Club</th>
          <th scope="col" class="text-end">Points</th>
        </tr>
      </thead>
      <tbody>
        {% for club in clubs %}
          <tr>
            <td>{{ club['name'] }}</td>
            <td class="text-end fw-semibold">{{ club['points'] }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
