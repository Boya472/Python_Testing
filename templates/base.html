<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GUDLFT{% endblock %}</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container-narrow { max-width: 920px; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container container-narrow">
      <a class="navbar-brand" href="{{ url_for('index') }}">GUDLFT</a>
      <div class="ms-auto">
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('leaderboard') }}">Leaderboard</a>
        <a class="btn btn-outline-light btn-sm ms-2" href="{{ url_for('logout') }}">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container container-narrow">
    {% include "_flash.html" %}
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
